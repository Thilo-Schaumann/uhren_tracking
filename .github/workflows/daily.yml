name: Daily watch scrape

on:
  schedule:
    - cron: "0 3 * * *"  # 05:00 CEST / 03:00 UTC — shifts to 04:00 CET after DST ends in October
  workflow_dispatch: {}

# One job writes data/watches.db and pushes it — never let two runs overlap (binary conflicts).
concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # World of Time's first run fetches several hundred detail pages politely
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python run.py

      - name: Commit updated database
        run: |
          git config user.name "watch-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/watches.db
          git diff --staged --quiet || git commit -m "Daily scrape $(date -u +%F)"
          git push
